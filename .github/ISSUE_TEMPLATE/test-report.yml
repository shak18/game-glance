name: Device test report
description: Report the results of testing a Game Glance release or test build.
title: "[Test report]: "
labels: ["testing"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Please check `docs/device-checklist.md` and the test call first, if one was provided.

        Do not attach unreviewed logs that may contain personal details. Never include passwords, authentication tokens, Steam credentials, or private account data.
  - type: dropdown
    id: build-type
    attributes:
      label: What did you test?
      options:
        - Test build / prerelease
        - Stable release
        - Development build
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version or build identifier
      placeholder: Version, release tag, or test-build link
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: Exact device model
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system and version
      placeholder: Distribution/channel and version
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Test context
      description: Include handheld/docked mode, resolution, Steam client context, or other relevant details.
      placeholder: For example, docked to a 1080p display
    validations:
      required: false
  - type: textarea
    id: feature
    attributes:
      label: Feature and scenario tested
      description: What were you trying to verify?
      placeholder: Feature, steps/scenario, and test call if applicable
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Passed
        - Failed
        - Partially working
        - Unable to complete
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      render: text
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: For failures, include what happened and whether it happens consistently.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the shortest reliable sequence, if there is a problem.
      placeholder: |
        1. Open...
        2. Navigate to...
        3. Observe...
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or additional notes
      description: Attach only relevant evidence, reviewed for personal or sensitive information.
    validations:
      required: false
